version: '3.8'

# Production overrides for docker-compose.yml
# Usage: docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up

services:
  speechscribe-api:
    # Use pre-built image from registry
    image: speechscribe-api:v1.0
    # Don't rebuild in production
    build: null
    
    environment:
      - LOG_LEVEL=WARN
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    restart: always
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Read-only root filesystem (except runtime dirs)
    read_only: false
    
    # Security options
    security_opt:
      - no-new-privileges:true

  speechscribe-ui:
    # Use pre-built image
    image: speechscribe-ui:v1.0
    build: null
    
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=https://api.example.com  # Set to your domain
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    
    restart: always
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    security_opt:
      - no-new-privileges:true

  ollama:
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    restart: always
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Use named volumes for better management in production
volumes:
  ollama-models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/ollama-models

  models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/models

  plugins:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/plugins

  cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/data/cache
